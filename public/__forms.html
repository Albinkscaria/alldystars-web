<!DOCTYPE html>
<!--
  Netlify Forms registration for the contact letter (components/ContactLetter).
  Netlify scans this static file at deploy time to learn the "contact" form and
  its fields; the letter on /contact posts to this path with form-name=contact.
  Keep the field names in sync with app/contact/page.jsx. Never linked or shown.
-->
<html>
  <head><meta charset="utf-8"><meta name="robots" content="noindex"></head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="website" enctype="multipart/form-data">
      <input type="text" name="name">
      <input type="text" name="company">
      <input type="email" name="email">
      <input type="text" name="services">
      <textarea name="idea"></textarea>
      <textarea name="postscript"></textarea>
      <input type="file" name="attachment">
      <input type="text" name="website">
    </form>
  </body>
</html>
