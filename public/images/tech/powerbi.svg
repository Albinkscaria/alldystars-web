<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Power BI mark: three rising bars in the brand yellows -->
  <defs>
    <linearGradient id="pb-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C811"/>
      <stop offset="1" stop-color="#E8A70D"/>
    </linearGradient>
    <linearGradient id="pb-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D85A"/>
      <stop offset="1" stop-color="#EBB21A"/>
    </linearGradient>
    <linearGradient id="pb-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE58D"/>
      <stop offset="1" stop-color="#F0C03A"/>
    </linearGradient>
  </defs>
  <rect x="78" y="10" width="30" height="108" rx="6" fill="url(#pb-a)"/>
  <rect x="49" y="40" width="30" height="78" rx="6" fill="url(#pb-b)"/>
  <rect x="20" y="70" width="30" height="48" rx="6" fill="url(#pb-c)"/>
</svg>
